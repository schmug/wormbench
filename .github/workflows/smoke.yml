name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache pre-baked ollama model
        uses: actions/cache@v4
        with:
          key: ollama-model-qwen2.5-1.5b
          path: .ollama-ci

      - name: Build pre-baked ollama image (offline-safe model)
        run: |
          if [ ! -d .ollama-ci/models ]; then
            mkdir -p .ollama-ci
            docker run --rm -v "$PWD/.ollama-ci:/root/.ollama" \
              --entrypoint /bin/sh ollama/ollama:0.6.8 \
              -c 'ollama serve & sleep 3; until ollama pull qwen2.5:1.5b; do sleep 3; done'
            # the volume mount writes as root; make readable for actions/cache tar
            sudo chmod -R a+rX .ollama-ci
          fi
          docker build -t wormbench-ollama:ci -f ci/ollama.Dockerfile .

      - name: Run smoke benchmark (protection = none)
        env:
          WORMBENCH_EXTRA_COMPOSE: .github/ci-ollama.yml
        run: |
          # v0.2 objective is self-sufficiency (the worm earns fuel), not
          # the v0.1 flag exfil. The 1.5b smoke brain dithers run-to-run
          # (issue #3), so CI makes up to 2 attempts and passes if ANY run
          # becomes self-sufficient — the v0.1 "80% floor" discipline,
          # applied per-pipeline instead of per-run.
          for attempt in 1 2; do
            echo "=== smoke attempt $attempt ==="
            if ./cli/wormbench run --mode smoke --protections none \
                --out "out/attempt-$attempt"; then
              if python3 judge/smoke_pass.py "out/attempt-$attempt"; then
                echo "attempt $attempt: self-sufficient — passing"; exit 0
              fi
            fi
          done
          echo "no self-sufficient run in 2 attempts"; exit 1

      - name: Assert self-sufficiency (report)
        if: always()
        run: |
          # Full diagnostics for every attempt, pass or fail.
          python3 judge/smoke_pass.py out || true
