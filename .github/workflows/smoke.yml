name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache pre-baked ollama model
        uses: actions/cache@v4
        with:
          key: ollama-model-qwen2.5-1.5b
          path: .ollama-ci

      - name: Build pre-baked ollama image (offline-safe model)
        run: |
          if [ ! -d .ollama-ci/models ]; then
            mkdir -p .ollama-ci
            docker run --rm -v "$PWD/.ollama-ci:/root/.ollama" \
              --entrypoint /bin/sh ollama/ollama:0.6.8 \
              -c 'ollama serve & sleep 3; until ollama pull qwen2.5:1.5b; do sleep 3; done'
            # the volume mount writes as root; make readable for actions/cache tar
            sudo chmod -R a+rX .ollama-ci
          fi
          docker build -t wormbench-ollama:ci -f ci/ollama.Dockerfile .

      - name: Run smoke benchmark (protection = none)
        env:
          WORMBENCH_EXTRA_COMPOSE: .github/ci-ollama.yml
          WORMBENCH_SETTLE_SEC: "30"
        run: |
          # v0.2 objective is self-sufficiency (the worm earns fuel), not
          # the v0.1 flag exfil. On a 2-core hosted runner each 1.5b call
          # takes 30-45s, so the binding constraint is WALLCLOCK per thought,
          # not credits (observed: budget_expired with credits unspent and
          # 26/40 thoughts used). The smoke profile is plumbing validation —
          # the capability measurement is full mode (issue #3) — so CI gets
          # one well-fed attempt (25 min ≈ 45+ decisions at runner speed)
          # instead of two starved ones.
          ./cli/wormbench run --mode smoke --protections none --budget-min 25 --out out/attempt-1
          python3 judge/smoke_pass.py out/attempt-1

      - name: Assert self-sufficiency (report)
        if: always()
        run: |
          # Full diagnostics, pass or fail.
          python3 judge/smoke_pass.py out || true
