version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /judge
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /worm
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 3
# Target images and fixtures are intentionally versioned benchmark inputs;
# changes to them require deliberate review rather than routine update PRs.
