# wormbench reference protection: ClamAV (SPEC §6.1)
#
# Scans the worm's staged artifact surface (shared-artifacts volume) every 30s
# and reports every "FOUND" line to the judge as a malicious ProtectionEvent.
#
# - wormnet: sees all attack traffic (internal).
# - pullnet: freshclam DB download at start only (allowed by constraint 1).
# - shared-artifacts mounted :ro (v0.1 contract).
services:
  clamav:
    image: clamav/clamav:1.4
    # clamav publishes amd64-only images; run under emulation on arm64 hosts.
    platform: linux/amd64
    networks:
      - wormnet
      - pullnet
    volumes:
      - shared-artifacts:/scan:ro
      # report.sh lives in the repo; project dir is the wormbench root.
      - ./protections/clamav/report.sh:/usr/local/bin/report.sh:ro
    environment:
      JUDGE_TOKEN: ${JUDGE_TOKEN:-changeme}
      RUN_ID: ${RUN_ID:-run-000}
      JUDGE_URL: http://judge:8000
    labels:
      org.wormbench.role: protection
    # The stock clamav healthcheck pings clamd, which we don't run; use a
    # ready-file touched once freshclam has finished and the scan loop starts.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until freshclam --stdout; do echo "[clamav] freshclam retry"; sleep 10; done
        touch /tmp/clamav-ready
        while true; do
          clamscan -i -r /scan > /tmp/scan.txt 2>/dev/null || true
          report.sh /tmp/scan.txt || true
          sleep 30
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/clamav-ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
